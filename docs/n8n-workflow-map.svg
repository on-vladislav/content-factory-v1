<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760">
  <rect width="1400" height="760" fill="#f7fafc"/>
  <style>
    .box { fill:#ffffff; stroke:#15324b; stroke-width:3; rx:18; }
    .accent { fill:#fff4e8; stroke:#f28c28; stroke-width:3; rx:18; }
    .heading { font:700 38px Arial,sans-serif; fill:#15324b; }
    .subtitle { font:400 21px Arial,sans-serif; fill:#456070; }
    .box-title { font:700 27px Arial,sans-serif; fill:#15324b; }
    .box-text { font:500 20px Arial,sans-serif; fill:#456070; }
    .route { stroke:#f28c28; stroke-width:3; fill:none; stroke-linecap:round; stroke-linejoin:round; }
    .route-dot { fill:#f28c28; }
    .label { font:600 17px Arial,sans-serif; fill:#b76516; }
    .note { font:400 18px Arial,sans-serif; fill:#456070; }
  </style>
  <text x="70" y="70" class="heading">Content Factory v1</text>
  <text x="70" y="108" class="subtitle">Как рабочие данные проходят через n8n, генерацию, согласование и публикацию</text>
  <text x="70" y="138" class="note">Публичная схема без credentials и параметров конкретного окружения</text>
  <rect x="70" y="205" width="250" height="130" class="box"/>
  <text x="195" y="253" text-anchor="middle" class="box-title">Telegram</text>
  <text x="195" y="292" text-anchor="middle" class="box-text">идея / материал</text>
  <rect x="410" y="205" width="250" height="130" class="box"/>
  <text x="535" y="253" text-anchor="middle" class="box-title">Notion</text>
  <text x="535" y="292" text-anchor="middle" class="box-text">Радар контента</text>
  <rect x="750" y="205" width="250" height="130" class="accent"/>
  <text x="875" y="253" text-anchor="middle" class="box-title">n8n</text>
  <text x="875" y="292" text-anchor="middle" class="box-text">маршрутизация</text>
  <rect x="1090" y="205" width="250" height="130" class="box"/>
  <text x="1215" y="253" text-anchor="middle" class="box-title">Codex Agent</text>
  <text x="1215" y="292" text-anchor="middle" class="box-text">черновик / план</text>
  <path d="M320 270 H410" class="route"/><circle cx="320" cy="270" r="5" class="route-dot"/><circle cx="410" cy="270" r="5" class="route-dot"/>
  <text x="365" y="252" text-anchor="middle" class="label">вход</text>
  <path d="M660 270 H750" class="route"/><circle cx="660" cy="270" r="5" class="route-dot"/><circle cx="750" cy="270" r="5" class="route-dot"/>
  <text x="705" y="252" text-anchor="middle" class="label">задание</text>
  <path d="M1000 270 H1090" class="route"/><circle cx="1000" cy="270" r="5" class="route-dot"/><circle cx="1090" cy="270" r="5" class="route-dot"/>
  <text x="1045" y="252" text-anchor="middle" class="label">контекст</text>
  <rect x="410" y="490" width="250" height="130" class="box"/>
  <text x="535" y="538" text-anchor="middle" class="box-title">Content Factory</text>
  <text x="535" y="577" text-anchor="middle" class="box-text">API + Worker + DB</text>
  <rect x="750" y="490" width="250" height="130" class="accent"/>
  <text x="875" y="538" text-anchor="middle" class="box-title">Согласование</text>
  <text x="875" y="577" text-anchor="middle" class="box-text">ревизии + MANUAL_LOCK</text>
  <rect x="1090" y="490" width="250" height="130" class="box"/>
  <text x="1215" y="538" text-anchor="middle" class="box-title">Publisher</text>
  <text x="1215" y="577" text-anchor="middle" class="box-text">публикация по команде</text>
  <path d="M1215 335 V415 H535 V490" class="route"/><circle cx="1215" cy="335" r="5" class="route-dot"/><circle cx="535" cy="490" r="5" class="route-dot"/>
  <text x="875" y="405" text-anchor="middle" class="label">результат генерации</text>
  <path d="M660 555 H750" class="route"/><circle cx="660" cy="555" r="5" class="route-dot"/><circle cx="750" cy="555" r="5" class="route-dot"/>
  <text x="705" y="538" text-anchor="middle" class="label">ревизия</text>
  <path d="M1000 555 H1090" class="route"/><circle cx="1000" cy="555" r="5" class="route-dot"/><circle cx="1090" cy="555" r="5" class="route-dot"/>
  <text x="1045" y="538" text-anchor="middle" class="label">утверждение</text>
  <path d="M1215 490 V415 H535 V335" class="route" stroke-dasharray="8 8"/><circle cx="1215" cy="490" r="5" class="route-dot"/><circle cx="535" cy="335" r="5" class="route-dot"/>
  <text x="875" y="438" text-anchor="middle" class="label">статус и ссылка в Notion</text>
  <text x="70" y="700" class="note">Генерация → проверка → ручная правка → утверждение → планирование → публикация</text>
</svg>

